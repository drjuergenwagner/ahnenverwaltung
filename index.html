<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ahnenverwaltung v3</title><link rel="stylesheet" href="styles.css"></head><body><header><div><h1>Ahnenverwaltung</h1><p>Personen · Familien · Ereignisse · Quellen · Dokumente · Orte</p></div><div><button id="export">Daten exportieren</button><label class="file">Daten importieren<input id="import" type="file" accept=".json"></label></div></header><nav><button class="tab active" data-t="tree">Ahnenbaum</button><button class="tab" data-t="persons">Personen</button><button class="tab" data-t="families">Familien</button><button class="tab" data-t="events">Ereignisse</button><button class="tab" data-t="sources">Quellen</button><button class="tab" data-t="docs">Dokumente</button><button class="tab" data-t="places">Orte</button></nav><main><section id="tree" class="page"><div class="toolbar"><input id="treeQ" placeholder="Person suchen"><select id="treeP"></select><label>Generationen <input id="gens" type="number" min="1" max="10" value="5"></label></div><div id="card" class="card"></div><div id="treeView"></div></section><section id="persons" class="page hide"><div class="split"><div><div class="toolbar"><input id="personQ" placeholder="Person suchen"><button id="addPerson">+ Person</button></div><div id="personsList"></div></div><div id="editor" class="card"></div></div></section><section id="families" class="page hide"><div class="toolbar"><button id="addFamily">+ Familie / Partnerschaft</button></div><div id="familiesList"></div></section><section id="events" class="page hide"><div class="toolbar"><button id="addEvent">+ Ereignis</button><input id="eventQ" placeholder="Ereignis suchen"></div><div id="eventsList"></div></section><section id="sources" class="page hide"><div class="toolbar"><button id="addSource">+ Quelle</button><input id="sourceQ" placeholder="Quelle suchen"></div><div id="sourcesList"></div></section><section id="docs" class="page hide"><div class="toolbar"><button id="addDoc">+ Dokument / Foto</button><input id="docQ" placeholder="Dokument suchen"></div><div id="docsList"></div></section><section id="places" class="page hide"><div class="toolbar"><button id="addPlace">+ Ort</button><input id="placeQ" placeholder="Ort suchen"></div><div id="placesList"></div></section></main><script src="app.js"></script></body></html>
